apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: challenge
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: PruneLast=true
    # projects must exist before the Applications that use them
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: challenge project - one app per round, each in its own namespace
  sourceRepos:
  - '*'
  destinations:
  - server: '*'
    namespace: '*'
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
