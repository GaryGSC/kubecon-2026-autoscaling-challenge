# Cluster resources shared by multiple applications (here: the argocd Namespace).
# No finalizer, so deleting this Application leaves the resources in place.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-resources
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/depeche-io/kubecon-2026-autoscaling-challenge.git
    path: gitops/bootstrap/cluster-resources
  syncPolicy:
    automated:
      allowEmpty: true
      selfHeal: true
