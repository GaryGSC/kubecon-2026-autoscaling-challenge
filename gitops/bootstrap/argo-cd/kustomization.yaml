apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

# Argo CD pinned explicitly - the argocd-autopilot base points to the moving "stable" tag.
# Upstream install.yaml is already non-HA (1 replica per component).
resources:
- https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml

configMapGenerator:
- name: argocd-cm
  behavior: merge
  literals:
  - timeout.reconciliation=15s
  # platform apps render Helm charts through kustomize helmCharts
  - kustomize.buildOptions=--enable-helm
- name: argocd-cmd-params-cm
  behavior: merge
  literals:
  # plain HTTP, so NodePort / Codespaces / Killercoda port forwarding just works
  - server.insecure=true

patches:
# public tutorial credentials: admin / @utoSc4ling
- patch: |-
    apiVersion: v1
    kind: Secret
    metadata:
      name: argocd-secret
    stringData:
      admin.password: $2a$10$Q1wwq9h6OooC4JsNxBTgC.bt3Wov3IbUNY240xH8/CLAIdyzDayIO
      admin.passwordMtime: "2026-11-01T00:00:00Z"
# ports[0] is "http" (80) in the pinned install.yaml
- target:
    kind: Service
    name: argocd-server
  patch: |-
    - op: replace
      path: /spec/type
      value: NodePort
    - op: add
      path: /spec/ports/0/nodePort
      value: 30080
# not needed for the tutorial - free the resources
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: argocd-dex-server
    spec:
      replicas: 0
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: argocd-notifications-controller
    spec:
      replicas: 0
