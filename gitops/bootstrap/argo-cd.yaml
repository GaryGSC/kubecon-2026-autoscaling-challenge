# Argo CD manages itself from gitops/bootstrap/argo-cd (the only Kustomize in this repo).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-cd
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/depeche-io/kubecon-2026-autoscaling-challenge.git
    path: gitops/bootstrap/argo-cd
  ignoreDifferences:
  - group: argoproj.io
    kind: Application
    jsonPointers:
    - /status
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
    - allowEmpty=true
    - ServerSideApply=true
