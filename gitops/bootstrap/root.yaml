# App of apps: syncs the AppProjects and every Application (one file each in gitops/applications).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  sources:
  - repoURL: https://github.com/depeche-io/kubecon-2026-autoscaling-challenge.git
    path: gitops/projects
  - repoURL: https://github.com/depeche-io/kubecon-2026-autoscaling-challenge.git
    path: gitops/applications
  ignoreDifferences:
  - group: argoproj.io
    kind: Application
    jsonPointers:
    - /status
  # the round source's revision is switched by hand (main <-> improved, see README) - don't revert it
  - group: argoproj.io
    kind: Application
    name: challenge-round1-cpu
    jsonPointers:
    - /spec/sources/0/targetRevision
  - group: argoproj.io
    kind: Application
    name: challenge-round2
    jsonPointers:
    - /spec/sources/0/targetRevision
  - group: argoproj.io
    kind: Application
    name: challenge-round3
    jsonPointers:
    - /spec/sources/0/targetRevision
  - group: argoproj.io
    kind: Application
    name: challenge-round4
    jsonPointers:
    - /spec/sources/0/targetRevision
  - group: argoproj.io
    kind: Application
    name: challenge-round5
    jsonPointers:
    - /spec/sources/0/targetRevision
  - group: argoproj.io
    kind: Application
    name: challenge-round6
    jsonPointers:
    - /spec/sources/0/targetRevision
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
    - allowEmpty=true
    - RespectIgnoreDifferences=true
