# One CronJob per scenario: bench-fast, bench-slow, bench-random and bench-all (all three one after another).
# Run on demand: Argo CD UI -> the round's app -> bench-<scenario> -> "Create Job"
# (or: kubectl -n <namespace> create job --from=cronjob/bench-<scenario> bench-<scenario>-$(date +%s))
{{- range $scenario := list "fast" "slow" "random" "all" }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bench-{{ $scenario }}
spec:
  # never fires on its own: suspended, and Feb 29 04:17 is far from any session slot
  schedule: "17 4 29 2 *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: k6-bench
            scenario: {{ $scenario }}
        spec:
          restartPolicy: Never
          containers:
          - name: k6
            image: {{ $.Values.image }}
            args:
            - run
            - --no-color
            # the end-of-test summary keeps every sample in memory (~360 B per request) - results are in Grafana
            - --no-summary
            - -o
            - experimental-prometheus-rw
            - --tag
            - namespace=$(POD_NAMESPACE)
            - --tag
            - k8s_cluster={{ $.Values.clusterTag }}
            - --tag
            - testid=$(JOB_NAME)
            - /scripts/bench.js
            env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: JOB_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['job-name']
            # the app of the round runs in the same namespace as this CronJob
            - name: TARGET
              value: http://app.$(POD_NAMESPACE).svc.cluster.local
            - name: K6_PROMETHEUS_RW_SERVER_URL
              value: {{ $.Values.prometheusRemoteWriteUrl }}
            # trends as native histograms: constant memory (trend stats keep every sample) and
            # percentiles per time window via histogram_quantile (trend stats are cumulative since start)
            - name: K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM
              value: "true"
            - name: K6_PROMETHEUS_RW_PUSH_INTERVAL
              value: 5s
            - name: SCENARIO
              value: {{ $scenario }}
            - name: DURATION
              value: {{ $.Values.duration | quote }}
            {{- range $name, $p := $.Values.scenarios }}
            - name: {{ upper $name }}_VUS
              value: {{ $p.vus | quote }}
            - name: {{ upper $name }}_MIN_WAIT
              value: {{ $p.minWait | quote }}
            - name: {{ upper $name }}_MAX_WAIT
              value: {{ $p.maxWait | quote }}
            {{- end }}
            - name: GOMEMLIMIT
              value: {{ $.Values.goMemLimit | quote }}
            resources:
              {{- toYaml $.Values.resources | nindent 14 }}
            volumeMounts:
            - name: scripts
              mountPath: /scripts
          volumes:
          - name: scripts
            configMap:
              name: k6-bench
{{- end }}
