# k6 benchmark CronJobs for the cpu-hpa namespace. CronJobs derive TARGET (http://app.<namespace>)
# and k6 tags from their namespace, so the same manifests serve both variants.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-benchmark-cpu-hpa
  namespace: argocd
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: cpu-hpa
  source:
    repoURL: https://github.com/depeche-io/kubecon-2026-autoscaling-challenge.git
    path: gitops/manifests/benchmark
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    # CRDs from other apps (ServiceMonitor, PodMonitor, Knative, Istio) may not exist yet - skip the dry run, retry applies later
    - SkipDryRunOnMissingResource=true
    retry:
      limit: 20
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
