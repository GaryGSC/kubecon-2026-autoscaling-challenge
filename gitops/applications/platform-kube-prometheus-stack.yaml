# kube-prometheus-stack (chart v92.17.0) + the autoscaling-challenge Grafana dashboard.
# Single instance everywhere, no Alertmanager. Chart CRDs are installed by Argo CD (ServerSideApply handles their size).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-kube-prometheus-stack
  namespace: argocd
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.17.0
    helm:
      releaseName: kps
      valuesObject:
        alertmanager:
          enabled: false

        # nothing alerts (no Alertmanager) and the dashboard uses none of the recording rules
        defaultRules:
          create: false

        # apiserver histograms are ~45k series nobody looks at here
        kubeApiServer:
          enabled: false

        # k3s embeds these in the k3s binary - nothing to scrape
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false

        # container CPU / memory (cAdvisor) at the same 5s as everything else - the chart defaults it to 10s
        # only cAdvisor: the kubelet's own /metrics is ~65k series on k3s (it carries the embedded control plane's too)
        kubelet:
          serviceMonitor:
            cAdvisorInterval: 5s
            kubelet: false
            probes: false
            # the dashboard reads only these two
            cAdvisorMetricRelabelings:
            - action: keep
              sourceLabels: [__name__]
              regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes

        # no admission webhook jobs (helm hooks) - keeps the Argo CD sync simple
        prometheusOperator:
          tls:
            enabled: false
          admissionWebhooks:
            enabled: false

        grafana:
          # Grafana's own metrics are ~7k series
          serviceMonitor:
            enabled: false
          # public tutorial credentials
          adminUser: admin
          adminPassword: "@utoSc4ling"
          service:
            type: NodePort
            nodePort: 30030
          # allow Grafana inside VS Code's Simple Browser / Codespaces port preview (an iframe)
          grafana.ini:
            security:
              allow_embedding: true

        prometheus:
          service:
            type: NodePort
            nodePort: 30090
          prometheusSpec:
            replicas: 1
            # 5s scrapes = lots of data points during the 4-minute benchmark;
            # the timeout must stay below the interval (default 10s would be rejected)
            scrapeInterval: 5s
            scrapeTimeout: 4s
            evaluationInterval: 5s
            retention: 2d
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
            # k6 pushes its results via Prometheus remote write
            enableRemoteWriteReceiver: true
            # every scraped series gets k8s_cluster (k6 adds it as a tag on its own)
            scrapeClasses:
            - name: default
              default: true
              relabelings:
              # action spelled out - the CRD defaults it, otherwise Argo CD shows a permanent diff
              - action: replace
                targetLabel: k8s_cluster
                replacement: k3d-autoscaling
            # leaderboard: every cluster remote-writes the dashboard metrics to the central Prometheus.
            # Unique cluster ID = this Prometheus Pod's UID (changes when the Pod is recreated),
            # sent as k8s_cluster=k3d-<first 8 chars> - locally k8s_cluster stays k3d-autoscaling.
            containers:
            - name: prometheus
              env:
              - name: POD_UID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.uid
            # Prometheus expands ${VAR} in external labels; they are only attached to remote-written samples
            externalLabels:
              leaderboard_id: ${POD_UID}
            remoteWrite:
            - url: https://prometheus-write.depeche.io/api/v1/write
              basicAuth:
                username:
                  name: leaderboard-remote-write
                  key: username
                password:
                  name: leaderboard-remote-write
                  key: password
              # k6_http_req_duration_seconds is a native histogram
              sendNativeHistograms: true
              # runs after external labels are attached
              writeRelabelConfigs:
              # only what the dashboard queries
              - action: keep
                sourceLabels: [__name__]
                regex: kube_pod_info|kube_pod_status_phase|kube_pod_status_ready|kube_pod_status_ready_time|kube_pod_created|kube_pod_container_resource_(limits|requests)|container_cpu_usage_seconds_total|container_memory_working_set_bytes|k6_.*|kn_revision_.*|kn_serving_.*|nginx_connections_.*|nginxlog_.*|phpfpm_.*|tomcat_threads_.*|app_.*
              - action: replace
                sourceLabels: [leaderboard_id]
                regex: (.{8}).*
                targetLabel: k8s_cluster
                replacement: k3d-$1
              - action: labeldrop
                regex: leaderboard_id|prometheus|prometheus_replica
            # pick up ServiceMonitors / PodMonitors / rules from any namespace
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false

        # leaderboard remote-write credentials (temporary, shared by all attendees)
        extraManifests:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: leaderboard-remote-write
          type: Opaque
          stringData:
            username: writer
            password: 29db3525c1d2d032e11d1862057c28e9

  # Grafana dashboard ConfigMap (Kustomize configMapGenerator from autoscaling-challenge.json, picked up by the Grafana sidecar)
  - repoURL: https://github.com/depeche-io/kubecon-2026-autoscaling-challenge.git
    path: gitops/manifests/grafana-dashboard
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    # CRDs from other apps (ServiceMonitor, PodMonitor, Knative, Istio) may not exist yet - skip the dry run, retry applies later
    - SkipDryRunOnMissingResource=true
    # retry on transient failures (large CRDs, slow image pulls)
    retry:
      limit: 20
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
