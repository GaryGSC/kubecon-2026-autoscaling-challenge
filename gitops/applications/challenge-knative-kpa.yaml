# Deploys one tutorial round into the knative-kpa namespace.
# Switch rounds in the Argo CD UI (App Details -> Edit -> Path = rounds/roundN/knative-kpa) or here in git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: challenge-knative-kpa
  namespace: argocd
spec:
  project: challenge
  destination:
    server: https://kubernetes.default.svc
    namespace: knative-kpa
  source:
    repoURL: https://github.com/depeche-io/kubecon-2026-autoscaling-challenge.git
    path: rounds/round1/knative-kpa
  syncPolicy:
    # no selfHeal: tuning the HPA / Knative annotations live in the Argo CD UI sticks
    # (the app shows OutOfSync - "Sync" resets it to the round's defaults)
    automated:
      prune: true
      selfHeal: false
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 1m
