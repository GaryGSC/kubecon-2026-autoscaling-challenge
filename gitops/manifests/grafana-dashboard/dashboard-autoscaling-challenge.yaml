# Grafana dashboard, picked up by the Grafana sidecar through the grafana_dashboard label (the only copy of the JSON - edit it here)
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-autoscaling-challenge
  labels:
    grafana_dashboard: "1"
data:
  autoscaling-challenge.json: |
    {
      "title": "Autoscaling Reality Check",
      "uid": "autoscaling-challenge",
      "tags": [
        "kubecon",
        "autoscaling"
      ],
      "timezone": "browser",
      "refresh": "5s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "schemaVersion": 39,
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            }
          },
          {
            "name": "k8s_cluster",
            "label": "k8s_cluster",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(kube_pod_info, k8s_cluster)",
              "refId": "A"
            },
            "definition": "label_values(kube_pod_info, k8s_cluster)",
            "refresh": 2,
            "sort": 1
          },
          {
            "name": "namespace",
            "label": "namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(kube_pod_info{k8s_cluster=\"$k8s_cluster\"}, namespace)",
              "refId": "A"
            },
            "definition": "label_values(kube_pod_info{k8s_cluster=\"$k8s_cluster\"}, namespace)",
            "regex": "/^round.*/",
            "refresh": 2,
            "sort": 1,
            "current": {
              "text": "round1-cpu",
              "value": "round1-cpu"
            }
          },
          {
            "name": "rate_interval",
            "label": "rate interval",
            "description": "Window of the rate() queries. Shorter = more reactive, noisier.",
            "type": "custom",
            "query": "15s,30s,1m,2m,5m",
            "options": [
              { "text": "15s", "value": "15s", "selected": false },
              { "text": "30s", "value": "30s", "selected": true },
              { "text": "1m", "value": "1m", "selected": false },
              { "text": "2m", "value": "2m", "selected": false },
              { "text": "5m", "value": "5m", "selected": false }
            ],
            "current": {
              "text": "30s",
              "value": "30s"
            }
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Namespace resources (everything in the namespace, incl. k6)",
          "collapsed": false,
          "id": 1,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "CPU usage (cores)",
          "id": 2,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Real CPU usage of all containers in the namespace vs. the sum of CPU requests of running Pods.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "stacking": {
                  "mode": "none"
                },
                "showPoints": "never"
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(container_cpu_usage_seconds_total{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\",container!=\"\",container!=\"POD\"}[$rate_interval]))",
              "legendFormat": "usage",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "B",
              "expr": "sum(kube_pod_container_resource_requests{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\",resource=\"cpu\"} and on(namespace, pod) (kube_pod_status_phase{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\",phase=\"Running\"} == 1))",
              "legendFormat": "requests",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Memory usage (working set)",
          "id": 3,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Real memory (working set) of all containers in the namespace vs. the sum of memory requests of running Pods.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "stacking": {
                  "mode": "none"
                },
                "showPoints": "never"
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(container_memory_working_set_bytes{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\",container!=\"\",container!=\"POD\"})",
              "legendFormat": "usage",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "B",
              "expr": "sum(kube_pod_container_resource_requests{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\",resource=\"memory\"} and on(namespace, pod) (kube_pod_status_phase{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\",phase=\"Running\"} == 1))",
              "legendFormat": "requests",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "row",
          "title": "k6 load (client view)",
          "collapsed": false,
          "id": 4,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Requests / s by response code",
          "id": 5,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "k6 requests per second by HTTP status (0 = no response: timeout / connection error).",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "stacking": {
                  "mode": "none"
                },
                "showPoints": "never"
              },
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^2.*"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^4.*"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^(5.*|0)$"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (rate(k6_http_reqs_total{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\"}[$rate_interval]))",
              "legendFormat": "{{status}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Requests / s by scenario",
          "id": 6,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 12,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "stacking": {
                  "mode": "none"
                },
                "showPoints": "never"
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (scenario) (rate(k6_http_reqs_total{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\"}[$rate_interval]))",
              "legendFormat": "{{scenario}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "stat",
          "title": "Requests in range",
          "id": 7,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "k6 requests in the selected time range; failed = not the expected response (non-2xx/3xx, timeout, connection error).",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 10
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "failed"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "red",
                          "value": 1
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(k6_http_reqs_total{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\"}[$__range]))",
              "instant": true,
              "legendFormat": "total",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "B",
              "expr": "sum(increase(k6_http_reqs_total{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\",expected_response=\"false\"}[$__range])) or vector(0)",
              "instant": true,
              "legendFormat": "failed",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "stat",
          "title": "Active VUs",
          "id": 8,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 14
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(k6_vus{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\"})",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "row",
          "title": "SLO & efficiency",
          "collapsed": false,
          "id": 9,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 18
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "Availability",
          "id": 10,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Successful (expected) k6 requests / all k6 requests in the selected time range.",
          "gridPos": {
            "h": 8,
            "w": 4,
            "x": 0,
            "y": 19
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.99
                  },
                  {
                    "color": "green",
                    "value": 0.999
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(k6_http_reqs_total{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\",expected_response=\"true\"}[$__range])) / sum(increase(k6_http_reqs_total{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\"}[$__range]))",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Request latency (k6)",
          "id": 11,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "From the k6 native histogram over the rate interval: p50-p95 of all scenarios together, plus p99 per scenario (scenarios run one after another).",
          "gridPos": {
            "h": 8,
            "w": 14,
            "x": 4,
            "y": 19
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "stacking": {
                  "mode": "none"
                },
                "showPoints": "never"
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum(rate(k6_http_req_duration_seconds{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\"}[$rate_interval])))",
              "legendFormat": "p50",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.90, sum(rate(k6_http_req_duration_seconds{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\"}[$rate_interval])))",
              "legendFormat": "p90",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.95, sum(rate(k6_http_req_duration_seconds{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\"}[$rate_interval])))",
              "legendFormat": "p95",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "refId": "D",
              "expr": "histogram_quantile(0.99, sum by (scenario) (rate(k6_http_req_duration_seconds{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\"}[$rate_interval])))",
              "legendFormat": "p99 {{scenario}}",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "stat",
          "title": "Avg. app Pods",
          "id": 13,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Average number of running Pods in the namespace over the time range, excluding k6 benchmark Pods.",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 19
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "avg_over_time(count(kube_pod_status_phase{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\",phase=\"Running\",pod!~\"bench-.*\"} == 1)[$__range:15s])",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "stat",
          "title": "CPU efficiency (range avg)",
          "id": 14,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Real CPU usage / sum of CPU requests of the running app Pods (k6 excluded). Low = paying for idle reservations; above 100 % = using unreserved node CPU (no or high CPU limit, e.g. Knative queue-proxy requests only 25m).",
          "gridPos": {
            "h": 8,
            "w": 4,
            "x": 0,
            "y": 27
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.3
                  },
                  {
                    "color": "green",
                    "value": 0.6
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "avg_over_time((sum(sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\",container!=\"\",container!=\"POD\",pod!~\"bench-.*\"}[1m])) and on(namespace, pod) (kube_pod_status_phase{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\",phase=\"Running\"} == 1)) / sum(kube_pod_container_resource_requests{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\",resource=\"cpu\",pod!~\"bench-.*\"} and on(namespace, pod) (kube_pod_status_phase{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\",phase=\"Running\"} == 1)))[$__range:15s])",
              "instant": true,
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "CPU efficiency (usage / requests)",
          "id": 15,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 4,
            "y": 27
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "stacking": {
                  "mode": "none"
                },
                "showPoints": "never"
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\",container!=\"\",container!=\"POD\",pod!~\"bench-.*\"}[$rate_interval])) and on(namespace, pod) (kube_pod_status_phase{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\",phase=\"Running\"} == 1)) / sum(kube_pod_container_resource_requests{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\",resource=\"cpu\",pod!~\"bench-.*\"} and on(namespace, pod) (kube_pod_status_phase{k8s_cluster=\"$k8s_cluster\",namespace=\"$namespace\",phase=\"Running\"} == 1))",
              "legendFormat": "CPU",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ]
        },
        {
          "type": "stat",
          "title": "MEM efficiency (range avg)",
          "id": 16,
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Real memory (working set) / sum of memory requests of the running app Pods (k6 excluded). Above 100 % = requests set too low.",
          "gridPos": {
            "h": 8,
            "w": 4,
            "x": 12,
            "y": 27
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
