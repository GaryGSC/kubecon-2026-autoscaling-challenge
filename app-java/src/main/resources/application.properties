spring.application.name=app-java
spring.threads.virtual.enabled=false

# App port. Concurrency = Tomcat worker pool: the "10 workers" equivalent of the Go/PHP rounds.
server.port=8080
server.tomcat.threads.max=${TOMCAT_THREADS:10}
server.tomcat.threads.min-spare=2
# Excess connections wait in the accept backlog
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}
server.tomcat.mbeanregistry.enabled=true

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# Actuator on a separate port so scrapes don't compete for app threads:
#   :8081/metrics  :8081/health  :8081/health/liveness  :8081/health/readiness
management.server.port=8081
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.prometheus=metrics
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
# also serve /livez + /readyz on the app port 8080 - Knative can only probe the serving port
management.endpoint.health.probes.add-additional-paths=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=10ms,50ms,100ms,250ms,500ms,1s,2s,5s

# Simulated warm-up before readiness flips to UP (liveness stays UP meanwhile)
startup.delay-seconds=${STARTUP_DELAY_SECONDS:30}
