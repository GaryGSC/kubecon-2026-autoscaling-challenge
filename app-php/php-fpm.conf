; Pool config (replaces www.conf).
[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
; When all workers are busy, excess requests wait in this listen backlog.
; This is the "queue" the tutorial is about.
listen.backlog = 511

pm = static
pm.max_children = ${FPM_WORKERS}
pm.status_path = /fpm-status
ping.path = /fpm-ping

request_terminate_timeout = 60s
clear_env = no
catch_workers_output = yes
; access log is off (nginx logs requests)
