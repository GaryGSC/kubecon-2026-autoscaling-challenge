worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;

  # tailed by the prometheus-nginxlog-exporter sidecar (requests by status code)
  log_format exporter '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
  access_log /var/log/nginx/access.log exporter;
  keepalive_timeout 65;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    # read by the nginx-prometheus-exporter sidecar
    location = /stub_status {
      access_log off;
      stub_status;
      allow 127.0.0.1;
      deny all;
    }

    # any path (and ?ms=... from k6) serves the static page
    location / {
      try_files /index.html =404;
    }
  }
}
