# Knative lets only the serving container declare a port, so the exporter
# sidecars are scraped by rewriting the target address of "user-port".
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: app
spec:
  selector:
    matchLabels:
      serving.knative.dev/service: app
  podMetricsEndpoints:
  - port: user-port
    interval: 5s
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_ip]
      targetLabel: __address__
      replacement: $1:9113
  - port: user-port
    interval: 5s
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_ip]
      targetLabel: __address__
      replacement: $1:4040
