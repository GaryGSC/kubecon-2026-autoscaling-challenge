# nginx side of the round 3 Pod, mounted at /etc/nginx/nginx.conf (nginx:1.29-alpine)
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }

http {
  log_format exporter '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
  access_log /var/log/nginx/access.log exporter;

  keepalive_timeout 65;

  server {
    listen 8080;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location = /stub_status { stub_status; allow 127.0.0.1; deny all; }

    location ~ ^/(fpm-status|fpm-ping)$ {
      allow 127.0.0.1;
      deny all;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param SCRIPT_NAME $uri;
      fastcgi_pass 127.0.0.1:9000;
    }

    location / {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_read_timeout 60s;
    }
  }
}
