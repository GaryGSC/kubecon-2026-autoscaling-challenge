# Round 1, requests-in-flight autoscaling: nginx as a Knative Service (KPA, concurrency).
# kubectl apply -n round1-in-flight -f rounds/round1-in-flight
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: app
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        # requests in flight per Pod the autoscaler aims for
        autoscaling.knative.dev/target: "10"
        autoscaling.knative.dev/window: "60s"
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "10"
    spec:
      containers:
      - name: nginx
        image: nginx:1.29-alpine
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: logs
          mountPath: /var/log/nginx
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:1.5.3
        args: ["--nginx.scrape-uri=http://127.0.0.1:8080/stub_status"]
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 32Mi
      - name: log-exporter
        image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.11.0
        args: ["-config-file", "/etc/nginxlog/nginxlog-exporter.hcl"]
        resources:
          requests:
            cpu: 25m
            memory: 16Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginxlog
        - name: logs
          mountPath: /var/log/nginx
          readOnly: true
      volumes:
      - name: html
        configMap:
          name: app-html
      - name: nginx-config
        configMap:
          name: app-nginx
      - name: logs
        emptyDir: {}

