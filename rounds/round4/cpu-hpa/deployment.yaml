apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: app
        image: ghcr.io/depeche-io/kubecon-2026-autoscaling-challenge/app-java:main
        env:
        - name: TOMCAT_THREADS
          value: "10"
        - name: STARTUP_DELAY_SECONDS
          value: "30"
        ports:
        - name: http
          containerPort: 8080
        - name: management
          containerPort: 8081
        # readiness flips only after the simulated warm-up - new Pods take a while to help
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 2
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 384Mi

