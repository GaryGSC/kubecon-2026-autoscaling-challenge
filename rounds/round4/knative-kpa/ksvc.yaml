apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: app
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        # requests in flight per Pod the autoscaler aims for
        autoscaling.knative.dev/target: "10"
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "10"
    spec:
      containers:
      - name: app
        image: ghcr.io/depeche-io/kubecon-2026-autoscaling-challenge/app-java:main
        env:
        - name: TOMCAT_THREADS
          value: "10"
        - name: STARTUP_DELAY_SECONDS
          value: "30"
        ports:
        - containerPort: 8080
        # readiness flips only after the simulated warm-up - new Pods take a while to help
        readinessProbe:
          httpGet:
            path: /readyz
          periodSeconds: 2
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 384Mi

