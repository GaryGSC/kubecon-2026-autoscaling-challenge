# Round 6, requests-in-flight autoscaling: BFF (ksvc "app") -> backend (ksvc "backend").
# kubectl apply -n round6 -f rounds/round6
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: app
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
        autoscaling.knative.dev/metric: concurrency
        # requests in flight per Pod the autoscaler aims for
        autoscaling.knative.dev/target: "10"
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "10"
    spec:
      containers:
      - image: ghcr.io/depeche-io/kubecon-2026-autoscaling-challenge/app-go:main
        env:
        - name: WORKERS
          value: "10"
        - name: MODE
          value: bff
        - name: BACKEND_URL
          value: http://backend.round6.svc.cluster.local
        # defaults when k6 sends no ?timeout= / ?backend_timeout= - keep BFF > backend
        - name: TIMEOUT_MS
          value: "3000"
        - name: BACKEND_TIMEOUT_MS
          value: "2500"
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
          periodSeconds: 2
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
