apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
        tier: round6
    spec:
      containers:
      - name: app
        image: ghcr.io/depeche-io/kubecon-2026-autoscaling-challenge/app-go:main
        env:
        - name: WORKERS
          value: "10"
        - name: MODE
          value: bff
        - name: BACKEND_URL
          value: http://backend
        # defaults when k6 sends no ?timeout= / ?backend_timeout= - keep BFF > backend
        - name: TIMEOUT_MS
          value: "3000"
        - name: BACKEND_TIMEOUT_MS
          value: "2500"
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
