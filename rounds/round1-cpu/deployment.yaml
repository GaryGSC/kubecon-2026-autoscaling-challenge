# Round 1, CPU-based autoscaling: nginx + HPA on CPU utilization.
# kubectl apply -n round1-cpu -f rounds/round1-cpu
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  # no replicas: the HPA owns them (minReplicas 1) - setting it here makes every Argo CD sync reset the scale
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: nginx
        image: nginx:1.29-alpine
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: logs
          mountPath: /var/log/nginx
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:1.5.3
        args: ["--nginx.scrape-uri=http://127.0.0.1:8080/stub_status"]
        ports:
        - name: nginx-metrics
          containerPort: 9113
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 32Mi
      - name: log-exporter
        image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.11.0
        args: ["-config-file", "/etc/nginxlog/nginxlog-exporter.hcl"]
        ports:
        - name: log-metrics
          containerPort: 4040
        resources:
          requests:
            cpu: 25m
            memory: 16Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginxlog
        - name: logs
          mountPath: /var/log/nginx
          readOnly: true
      volumes:
      - name: html
        configMap:
          name: app-html
      - name: nginx-config
        configMap:
          name: app-nginx
      - name: logs
        emptyDir: {}

